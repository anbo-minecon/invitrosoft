<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías</title>
    <link rel="stylesheet" href="css/formul.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <style>
        /* Estilos adicionales específicos para categorías */
        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 2px 4px var(--shadow);
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-hover);
            border-color: var(--primary);
        }

        .category-card-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .category-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-bg);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .category-icon svg {
            width: 24px;
            height: 24px;
            fill: var(--primary);
        }

        .category-info {
            flex: 1;
            min-width: 0;
        }

        .category-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.3;
            transition: color var(--transition);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .category-id {
            background: var(--light-gray);
            color: var(--text-secondary);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            border: 1px solid var(--border);
        }

        .category-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 42px;
        }

        .category-stats {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 12px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            transition: color var(--transition);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .category-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        /* Modal de visualización mejorado */
        .view-modal-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 11001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .view-modal-enhanced {
            background: var(--card-bg, #fff);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-view-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 32px;
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .category-icon-large {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .modal-view-title h2 {
            margin: 0;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .modal-view-title p {
            margin: 4px 0 0 0;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .modal-close-enhanced {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: all 0.2s;
        }

        .modal-close-enhanced:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-view-body {
            padding: 32px;
            overflow-y: auto;
            flex: 1;
        }

        .info-card {
            display: flex;
            gap: 16px;
            padding: 20px;
            background: var(--muted, #f8faf9);
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border, #e5e7eb);
            transition: all 0.2s;
        }

        .info-card:hover {
            background: var(--primary-bg, #f0f4f2);
            border-color: var(--primary, #007832);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 120, 50, 0.1);
        }

        .info-card.highlight {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 2px solid #00783220;
        }

        .info-icon {
            width: 44px;
            height: 44px;
            background: var(--card-bg, #fff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 120, 50, 0.08);
        }

        .info-content {
            flex: 1;
        }

        .info-content.full-width {
            width: 100%;
        }

        .info-content label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary, #6b7280);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .info-value {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary, #1f2937);
            line-height: 1.5;
        }

        .quantity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .quantity-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .quantity-number {
            font-size: 24px;
            font-weight: 700;
        }

        .quantity-level {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            height: 12px;
            background: var(--border, #e5e7eb);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: var(--progress);
            background: var(--bar-color);
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary, #6b7280);
            font-weight: 500;
        }

        .level-indicators {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border, #e5e7eb);
        }

        .level-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary, #6b7280);
            opacity: 0.5;
            transition: all 0.3s;
        }

        .level-item.active {
            opacity: 1;
            font-weight: 600;
        }

        .level-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .level-item.active .level-dot {
            width: 12px;
            height: 12px;
            box-shadow: 0 0 0 3px currentColor;
            opacity: 0.3;
        }

        .modal-view-footer {
            padding: 20px 32px;
            background: var(--muted, #f9fafb);
            border-top: 1px solid var(--border, #e5e7eb);
            display: flex;
            justify-content: flex-end;
        }

        .btn-close-modal {
            background: var(--primary, #007832);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-close-modal:hover {
            background: var(--primary-light, #00a844);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 120, 50, 0.3);
        }

        .btn-close-modal:active {
            transform: translateY(0);
        }

        .view-protocol-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 11001;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(34, 34, 34, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .view-protocol-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .view-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(34, 34, 34, 0.25);
            z-index: 11001;
        }

        .modal {
            z-index: 11000;
        }

        /* Modo oscuro */
        body.dark-mode .view-modal-enhanced {
            background: var(--card-bg, #252d3d);
        }

        body.dark-mode .info-card {
            background: var(--muted, #1e2530);
            border-color: var(--border, #2d3748);
        }

        body.dark-mode .info-card:hover {
            background: #2a3142;
            border-color: var(--primary, #007832);
        }

        body.dark-mode .info-icon {
            background: var(--card-bg, #252d3d);
        }

        @media (max-width: 768px) {
            .view-modal-header,
            .view-modal-body,
            .view-modal-footer {
                padding: 16px 20px;
            }

            .modal-view-header h2 {
                font-size: 1.5em;
            }

            .quantity-number {
                font-size: 20px;
            }

            .level-indicators {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Buscar categoría...">
            </div>
            <button class="add-btn" onclick="openModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>
                </svg>
                Nueva Categoría
            </button>
        </div>

        <div class="cards-grid" id="categoriesGrid">
            <!-- Las categorías se cargarán aquí dinámicamente -->
        </div>
    </div>

    <!-- Modal para crear/editar -->
    <div class="modal" id="categoryModal">
        <!-- El contenido del modal se genera dinámicamente -->
    </div>

    <div id="banner-notificacion"></div>

    <script>
        let editingId = null;
        let reactivos = [];

        // Cargar reactivos desde la API
        async function loadReactivos() {
            try {
                const response = await fetch('db/reactivos.php');
                if (response.ok) {
                    reactivos = await response.json();
                }
            } catch (error) {
                console.error('Error al cargar reactivos:', error);
                reactivos = [];
            }
        }

        // Obtener cantidad de reactivos por categoría
        function getReactiveCountByCategory(categoryId) {
            return reactivos.filter(r => String(r.categoria_id) === String(categoryId)).length;
        }

        // Buscar
        document.getElementById('searchInput').addEventListener('input', renderCards);

        // Renderizar cards desde la base de datos
        async function renderCards() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '<div class="empty-state">Cargando...</div>';
            
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            
            try {
                // Cargar reactivos primero
                await loadReactivos();
                
                const res = await fetch('db/categorias.php?accion=listar');
                if (!res.ok) {
                    if (res.status === 401) {
                        window.location.href = '../../src/index.html';
                        return;
                    }
                    throw new Error(`Error ${res.status}`);
                }
                
                const data = await res.json();
                let filtered = data;
                
                if (search) {
                    filtered = data.filter(c =>
                        c.nombre.toLowerCase().includes(search) ||
                        (c.descripcion && c.descripcion.toLowerCase().includes(search)) ||
                        String(c.id).includes(search)
                    );
                }

                if (!filtered.length) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M19,19H5V5H19V19M17,17H7V15H17V17M15,13H7V11H15V13M13,9H7V7H13V9Z"/>
                            </svg>
                            <h3>No hay categorías registradas</h3>
                            <p>Comienza agregando tu primera categoría</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = '';
                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'category-card';
                    
                    const descripcion = item.descripcion || 'Sin descripción';
                    const cantidad = getReactiveCountByCategory(item.id);
                    
                    card.innerHTML = `
                        <div class="category-card-header">
                            <div class="category-icon">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,5V19H5V5H19M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/>
                                </svg>
                            </div>
                            <div class="category-info">
                                <div class="category-name">${item.nombre}</div>
                                <div class="category-id">#${String(item.id).padStart(3, '0')}</div>
                            </div>
                        </div>
                        
                        <div class="category-description">${descripcion}</div>
                        
                        <div class="category-stats">
                            <div class="stat-value">${cantidad}</div>
                            <div class="stat-label">Reactivos</div>
                        </div>
                        
                        <div class="category-actions">
                            <button class="action-btn view-btn" onclick="viewCategory(${item.id})" title="Ver detalles">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z"/>
                                </svg>
                            </button>
                            <button class="action-btn edit-btn" onclick="openModal(${item.id})" title="Editar">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"/>
                                </svg>
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteCategory(${item.id})" title="Eliminar">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/>
                                </svg>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error al cargar categorías:', error);
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>Error al cargar las categorías</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Modal para crear/editar
        function openModal(id = null) {
            editingId = id;
            let nombre = '';
            let descripcion = '';
            let modalTitle = 'Nueva Categoría';

            if (id) {
                fetch('db/categorias.php?accion=listar')
                    .then(res => res.json())
                    .then(data => {
                        const found = data.find(c => c.id == id);
                        if (found) {
                            nombre = found.nombre;
                            descripcion = found.descripcion || '';
                            modalTitle = 'Editar Categoría';
                        }
                        showModal(nombre, descripcion, modalTitle);
                    });
            } else {
                showModal('', '', modalTitle);
            }
        }

        function showModal(nombre = '', descripcion = '', modalTitle = 'Nueva Categoría') {
            const modal = document.getElementById('categoryModal');
            
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="modal-title">${modalTitle}</h2>
                        <button class="close-btn" onclick="closeModal()">×</button>
                    </div>
                    <div class="modal-body">
                        <form id="categoryForm">
                            <div class="form-group">
                                <label>Nombre de la categoría</label>
                                <input type="text" id="nombre" value="${nombre || ''}" required>
                            </div>
                            <div class="form-group">
                                <label>Descripción</label>
                                <textarea id="descripcion" rows="4">${descripcion || ''}</textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-buttons">
                        <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                        <button type="button" class="btn-save" onclick="saveCategory()">Guardar</button>
                    </div>
                </div>
            `;
            modal.classList.add('active');
        }

        async function saveCategory() {
            const nombre = document.getElementById('nombre').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();

            if (!nombre) {
                mostrarNotificacion('Por favor ingrese un nombre', false);
                return;
            }

            let body = { nombre, descripcion };
            let url = 'db/categorias.php?accion=crear';
            let method = 'POST';
            
            if (editingId) {
                url = 'db/categorias.php?accion=editar';
                body.id = editingId;
            }

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const result = await res.json();
                mostrarNotificacion(result.msg, result.success);
                if (result.success) {
                    closeModal();
                    renderCards();
                }
            } catch (error) {
                mostrarNotificacion('Error al guardar la categoría', false);
            }
        }

        async function deleteCategory(id) {
            if (!confirm('¿Está seguro de que desea eliminar esta categoría?')) return;
            
            try {
                const res = await fetch('db/categorias.php?accion=eliminar', {
                    method: 'POST',
                    body: new URLSearchParams({id})
                });
                const result = await res.json();
                mostrarNotificacion(result.msg, result.success);
                if(result.success) renderCards();
            } catch (error) {
                mostrarNotificacion('Error al eliminar la categoría', false);
            }
        }

        async function viewCategory(id) {
            try {
                const res = await fetch('db/categorias.php?accion=listar');
                if (!res.ok) {
                    if (res.status === 401) window.location.href = '/invitrosoft/src/index.html';
                    throw new Error('HTTP '+res.status);
                }
                
                const data = await res.json();
                const category = data.find(c => c.id == id);
                
                if (!category) {
                    alert('Categoría no encontrada');
                    return;
                }
                
                const count = getReactiveCountByCategory(category.id);
                
                // Calcular el máximo entre todas las categorías
                const allCounts = data.map(c => getReactiveCountByCategory(c.id));
                const maxCount = Math.max(...allCounts, 1);
                const percentage = (count / maxCount) * 100;
                
                // Determinar nivel y color
                let level = 'Bajo';
                let levelColor = '#fbbf24';
                let barColor = '#fbbf24';
                
                if (percentage >= 70) {
                    level = 'Alto';
                    levelColor = '#10b981';
                    barColor = '#10b981';
                } else if (percentage >= 40) {
                    level = 'Medio';
                    levelColor = '#3b82f6';
                    barColor = '#3b82f6';
                }
                
                const modal = document.createElement('div');
                modal.className = 'view-modal-bg';
                modal.innerHTML = `
                    <div class="view-modal-enhanced">
                        <div class="modal-view-header">
                            <div class="category-icon-large">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 3H4C3.44772 3 3 3.44772 3 4V9C3 9.55228 3.44772 10 4 10H9C9.55228 10 10 9.55228 10 9V4C10 3.44772 9.55228 3 9 3Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M20 3H15C14.4477 3 14 3.44772 14 4V9C14 9.55228 14.4477 10 15 10H20C20.5523 10 21 9.55228 21 9V4C21 3.44772 20.5523 3 20 3Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M9 14H4C3.44772 14 3 14.4477 3 15V20C3 20.5523 3.44772 21 4 21H9C9.55228 21 10 20.5523 10 20V15C10 14.4477 9.55228 14 9 14Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M20 14H15C14.4477 14 14 14.4477 14 15V20C14 20.5523 14.4477 21 15 21H20C20.5523 21 21 20.5523 21 20V15C21 14.4477 20.5523 14 20 14Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <div class="modal-view-title">
                                <h2>${category.nombre}</h2>
                                <p>#${String(category.id).padStart(3, '0')}</p>
                            </div>
                            <button class="modal-close-enhanced" onclick="this.closest('.view-modal-bg').remove()">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>

                        <div class="modal-view-body">
                            <div class="info-card">
                                <div class="info-icon">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M4 7H20M10 11V17M14 11V17M5 7L6 19C6 19.5304 6.21071 20.0391 6.58579 20.4142C6.96086 20.7893 7.46957 21 8 21H16C16.5304 21 17.0391 20.7893 17.4142 20.4142C17.7893 20.0391 18 19.5304 18 19L19 7M9 7V4C9 3.73478 9.10536 3.48043 9.29289 3.29289C9.48043 3.10536 9.73478 3 10 3H14C14.2652 3 14.5196 3.10536 14.7071 3.29289C14.8946 3.48043 15 3.73478 15 4V7" stroke="#007832" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                                <div class="info-content">
                                    <label>Nombre de categoría</label>
                                    <p class="info-value">${category.nombre}</p>
                                </div>
                            </div>

                            <div class="info-card">
                                <div class="info-icon">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="#007832" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M14 2V8H20M16 13H8M16 17H8M10 9H8" stroke="#007832" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                                <div class="info-content">
                                    <label>Descripción</label>
                                    <p class="info-value">${category.descripcion || 'Sin descripción proporcionada'}</p>
                                </div>
                            </div>

                            <div class="info-card highlight">
                                <div class="info-icon">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M9 11L12 14L22 4M21 12V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H16" stroke="#007832" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                                <div class="info-content full-width">
                                    <div class="quantity-header">
                                        <label>Reactivos registrados</label>
                                        <div class="quantity-badge" style="background: ${levelColor}20; color: ${levelColor};">
                                            <span class="quantity-number">${count}</span>
                                            <span class="quantity-level">Nivel ${level}</span>
                                        </div>
                                    </div>
                                    
                                    <div class="progress-container">
                                        <div class="progress-bar">
                                            <div class="progress-fill" style="--progress: ${percentage}%; --bar-color: ${barColor};"></div>
                                        </div>
                                        <div class="progress-labels">
                                            <span>0</span>
                                            <span>${maxCount}</span>
                                        </div>
                                    </div>

                                    <div class="level-indicators">
                                        <div class="level-item ${percentage < 40 ? 'active' : ''}">
                                            <div class="level-dot" style="background: #fbbf24;"></div>
                                            <span>Bajo (0-39%)</span>
                                        </div>
                                        <div class="level-item ${percentage >= 40 && percentage < 70 ? 'active' : ''}">
                                            <div class="level-dot" style="background: #3b82f6;"></div>
                                            <span>Medio (40-69%)</span>
                                        </div>
                                        <div class="level-item ${percentage >= 70 ? 'active' : ''}">
                                            <div class="level-dot" style="background: #10b981;"></div>
                                            <span>Alto (70-100%)</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="modal-view-footer">
                            <button class="btn-close-modal" onclick="this.closest('.view-modal-bg').remove()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                Cerrar
                            </button>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(modal);
                
                // Cerrar al hacer clic en el overlay
                modal.querySelector('.view-modal-bg').addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.remove();
                    }
                });
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar la categoría');
            }
        }

        function mostrarNotificacion(msg, ok = true) {
            const n = document.getElementById('banner-notificacion');
            n.innerHTML = `
                <div style="
                    display:flex;
                    align-items:center;
                    gap:10px;
                    background:${ok ? '#eafaf1' : '#fdecea'};
                    color:${ok ? '#218838' : '#c0392b'};
                    border:1.5px solid ${ok ? '#2ecc71' : '#e74c3c'};
                    border-radius:8px;
                    padding:12px 24px;
                    font-size:1.1rem;
                    font-weight:600;
                    box-shadow:0 2px 8px rgba(0,0,0,0.08);
                ">
                    <span style="font-size:1.5em;">
                        ${ok
                            ? '<svg width="24" height="24" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2ecc71"/><path d="M7 13l3 3 7-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
                            : '<svg width="24" height="24" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#e74c3c"/><path d="M15 9l-6 6M9 9l6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>'
                        }
                    </span>
                    <span>${msg}</span>
                </div>
            `;
            n.style.display = 'block';
            setTimeout(() => {
                n.style.display = 'none';
                n.innerHTML = '';
            }, 2500);
        }

        window.closeModal = function() {
            document.getElementById('categoryModal').classList.remove('active');
            document.getElementById('categoryModal').innerHTML = '';
            editingId = null;
        }

        // Inicializar
        renderCards();
    </script>
    <script src="js/header-footer.js"></script>
</body>
</html>
